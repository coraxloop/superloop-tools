# Vendored from https://github.com/Byron/pulldown-cmark-to-cmark
# tag v23.0.1, commit 8e153a295d2d5c1fc7e092c1129b72e8e0f305bc
# (Apache-2.0, LICENSE-APACHE alongside). ADOPTED into the workspace:
# edition, rust-version, and the workspace clippy/check lints apply,
# so src/ may diverge from the upstream tag where those demand it —
# keep divergences minimal and let this comment stay the provenance
# record. Upstream tests are not vendored: the formatter is proven
# against this repository's own corpus instead.
# Local spelling preservation keeps quote/list padding and authored code spans;
# focused lint exceptions retain upstream event-machine layout and constructor API.

[package]
name = "pulldown-cmark-to-cmark"
description = "Convert pulldown-cmark Events back to the string they were parsed from (vendored)"
version = "23.0.1"
license = "Apache-2.0"

edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[package.metadata.superloop]
tier = 1
release-group = "pulldown-cmark-to-cmark"

[dependencies]
tracing = { workspace = true }
pulldown-cmark = { workspace = true }
unicase = { workspace = true }

[lints]
workspace = true
